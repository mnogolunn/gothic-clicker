<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grimoire of the Dead</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: #070708;
            background-image: radial-gradient(circle at center, #141216 0%, #070708 100%);
            color: #a3a3a3;
            font-family: 'Cinzel', 'Georgia', serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px; overflow-x: hidden;
        }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #3a1a1a; padding-bottom: 10px; width: 100%; max-width: 400px; }
        h1 { color: #8b0000; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 8px rgba(139, 0, 0, 0.6); }
        .stats-container {
            background: #0f0e12; border: 2px solid #2a2421; border-radius: 4px; padding: 15px;
            text-align: center; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); margin-bottom: 25px; position: relative;
        }
        .blood-counter { font-size: 26px; font-weight: bold; color: #da2c2c; text-shadow: 0 0 10px rgba(218, 44, 44, 0.4); margin-bottom: 3px; }
        .cps-counter { font-size: 11px; color: #6e6e73; text-transform: uppercase; letter-spacing: 1px; }
        .altar-wrapper { position: relative; margin-bottom: 25px; }
        .altar-area {
            width: 180px; height: 180px; background: radial-gradient(circle, #1c1414 0%, #0a0808 100%);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 30px rgba(139, 0, 0, 0.2); cursor: pointer;
            transition: transform 0.05s ease; border: 3px solid #2d1a1a; -webkit-tap-highlight-color: transparent;
        }
        .altar-area:active { transform: scale(0.95); border-color: #5c1e1e; }
        .altar-icon { font-size: 60px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); pointer-events: none; }
        .ritual-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .ritual-item { background: #0d0c0f; border: 1px solid #241f21; border-left: 4px solid #4a1515; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .ritual-item.disabled { opacity: 0.3; }
        .ritual-info h3 { font-size: 14px; color: #d1cbd1; margin-bottom: 3px; }
        .ritual-info p { font-size: 11px; color: #5c5c64; }
        .cast-btn {
            background: linear-gradient(180deg, #1f1414 0%, #120a0a 100%); color: #b8a2a2;
            border: 1px solid #422626; padding: 8px 14px; font-family: inherit; font-size: 11px;
            font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .cast-btn:disabled { color: #4a4a4f; border-color: #1c1818; background: #0a090b; }
        .floating-essence {
            position: absolute; color: #da2c2c; font-weight: bold; font-size: 24px;
            pointer-events: none; left: 50%; top: 20%; transform: translateX(-50%);
            animation: riseAndFade 0.6s ease-out forwards; text-shadow: 0 0 6px rgba(0,0,0,0.9); z-index: 100;
        }
        @keyframes riseAndFade {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Grimoire Web Altar</h1>
    </div>

    <div class="stats-container">
        <div class="blood-counter" id="blood-display">0 Крови</div>
        <div class="cps-counter" id="cps-display">Жатва душ: 0 / сек</div>
    </div>

    <div class="altar-wrapper" id="altar-wrapper">
        <div class="altar-area" id="altar-zone">
            <div class="altar-icon">🍷</div>
        </div>
    </div>

    <div class="ritual-container">
        <div class="ritual-item">
            <div class="ritual-info">
                <h3 id="click-name">Оскверненное касание (Ранг 1)</h3>
                <p id="click-desc">Ритуал дает +1 Крови</p>
            </div>
            <button class="cast-btn" id="btn-click">Ц: 10</button>
        </div>
        <div class="ritual-item">
            <div class="ritual-info">
                <h3>Восставший Гуль</h3>
                <p>+1 Крови/сек | Воскрешено: <span id="count-ghoul">0</span></p>
            </div>
            <button class="cast-btn" id="btn-ghoul">Ц: 15</button>
        </div>
        <div class="ritual-item">
            <div class="ritual-info">
                <h3>Проклятый Призрак</h3>
                <p>+5 Крови/сек | Воскрешено: <span id="count-wraith">0</span></p>
            </div>
            <button class="cast-btn" id="btn-wraith">Ц: 100</button>
        </div>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на весь экран телефона

        let game = {
            blood: 0, touchPower: 1, upgradeCost: 10, rank: 1,
            minions: { ghoul: { count: 0, cps: 1, cost: 15 }, wraith: { count: 0, cps: 5, cost: 100 } }
        };

        const altarZone = document.getElementById('altar-zone');
        const altarWrapper = document.getElementById('altar-wrapper');

        function doClick(e) {
            if (e) e.preventDefault();
            game.blood += game.touchPower;
            createFloatingEssence(`+${game.touchPower}`);
            updateUI();
            tg.HapticFeedback.impactOccurred('medium'); // Вибрация телефона при клике!
        }

        altarZone.ontouchstart = doClick;
        altarZone.onclick = doClick;

        function createFloatingEssence(text) {
            const essence = document.createElement('div');
            essence.classList.add('floating-essence');
            essence.innerText = text;
            altarWrapper.appendChild(essence);
            setTimeout(() => essence.remove(), 600);
        }

        function getCps() {
            return (game.minions.ghoul.count * game.minions.ghoul.cps) + (game.minions.wraith.count * game.minions.wraith.cps);
        }

        document.getElementById('btn-click').onclick = function() {
            if (game.blood >= game.upgradeCost) {
                game.blood -= game.upgradeCost; game.rank++; game.touchPower += 2;
                game.upgradeCost = Math.floor(game.upgradeCost * 1.7); updateUI();
            }
        };

        function setupBtn(type) {
            document.getElementById(`btn-${type}`).onclick = function() {
                let m = game.minions[type];
                if (game.blood >= m.cost) {
                    game.blood -= m.cost; m.count++; m.cost = Math.floor(m.cost * 1.35); updateUI();
                }
            };
        }
        setupBtn('ghoul'); setupBtn('wraith');

        function updateUI() {
            document.getElementById('blood-display').innerText = `${game.blood} Крови`;
            document.getElementById('cps-display').innerText = `Жатва душ: ${getCps()} / сек`;
            document.getElementById('click-name').innerText = `Оскверненное касание (Ранг ${game.rank})`;
            document.getElementById('click-desc').innerText = `Ритуал дает +${game.touchPower} Крови`;
            
            updateBtnState('btn-click', game.upgradeCost);
            updateBtnState('btn-ghoul', game.minions.ghoul.cost);
            updateBtnState('btn-wraith', game.minions.wraith.cost);
            document.getElementById('count-ghoul').innerText = game.minions.ghoul.count;
            document.getElementById('count-wraith').innerText = game.minions.wraith.count;
        }

        function updateBtnState(id, cost) {
            const btn = document.getElementById(id); btn.innerText = `Ц: ${cost}`;
            if (game.blood >= cost) { btn.disabled = false; btn.parentElement.classList.remove('disabled'); }
            else { btn.disabled = true; btn.parentElement.classList.add('disabled'); }
        }

        setInterval(() => { game.blood += getCps(); updateUI(); }, 1000);
        updateUI();
    </script>
</body>
</html>
